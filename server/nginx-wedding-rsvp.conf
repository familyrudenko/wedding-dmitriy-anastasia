limit_req_zone $binary_remote_addr zone=wedding_rsvp:10m rate=10r/m;

map $http_origin $wedding_cors_origin {
    default "";
    ~^https?://(www\.)?rudenko-family\.ru$ $http_origin;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 92.118.170.205;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 92.118.170.205;

    ssl_certificate /etc/letsencrypt/live/92.118.170.205/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/92.118.170.205/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WEDDING_TLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 8k;
    add_header Access-Control-Allow-Origin $wedding_cors_origin always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/wedding-rsvp-access.log;
    error_log /var/log/nginx/wedding-rsvp-error.log warn;

    location = /api/rsvp {
        limit_req zone=wedding_rsvp burst=5 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            return 204;
        }
        if ($request_method != POST) {
            return 405;
        }

        proxy_pass https://wedding-dmitriy-anastasia.familyrudenko.workers.dev/api/rsvp;
        proxy_http_version 1.1;
        proxy_set_header Host wedding-dmitriy-anastasia.familyrudenko.workers.dev;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name wedding-dmitriy-anastasia.familyrudenko.workers.dev;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    location / {
        return 404;
    }
}
